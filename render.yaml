services:
  - type: web
    name: sheridan-publicworks-dev
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sheridan-publicworks-db-dev
          property: connectionString

databases:
  - name: sheridan-publicworks-db-dev
    plan: free
